<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - ShopEasy</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <a href="index.html" class="logo">Shop<span>Easy</span></a>
    <nav class="nav">
      <a href="index.html">Trang chủ</a>
      <a href="products.html">Sản phẩm</a>
      <a href="orders.html">Đơn hàng</a>
      <a href="cart.html">Giỏ hàng <span id="cart-count" class="badge">0</span></a>
    </nav>
    <div id="user-box" class="user-box">
      <a href="login.html" class="btn">Đăng nhập</a>
    </div>
  </header>

  <main>
    <form id="login-form" class="form-box">
      <h2>Đăng nhập</h2>
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Mật khẩu" required>
      <p id="message" class="message"></p>
      <button class="btn">Đăng nhập</button>
      <p>Chưa có tài khoản? <a href="register.html">Đăng ký</a></p>
    </form>
  </main>

  <footer class="footer">© 2026 ShopEasy - Final Project C4E</footer>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
