<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sản phẩm - ShopEasy</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <a href="index.html" class="logo">Shop<span>Easy</span></a>
    <nav class="nav">
      <a href="index.html">Trang chủ</a>
      <a href="products.html">Sản phẩm</a>
      <a href="orders.html">Đơn hàng</a>
      <a href="cart.html">Giỏ hàng <span id="cart-count" class="badge">0</span></a>
    </nav>
    <div id="user-box" class="user-box">
      <a href="login.html" class="btn">Đăng nhập</a>
    </div>
  </header>

  <main class="container">
    <div class="filter-bar">
      <input type="text" id="search" placeholder="Tìm theo tên sản phẩm...">
      <select id="category">
        <option value="">Tất cả danh mục</option>
        <option value="Gaming">Gaming</option>
        <option value="Máy tính">Máy tính</option>
        <option value="Thời trang">Thời trang</option>
        <option value="Nội thất">Nội thất</option>
      </select>
      <select id="sort">
        <option value="">Sắp xếp</option>
        <option value="asc">Giá tăng dần</option>
        <option value="desc">Giá giảm dần</option>
      </select>
    </div>
    <div id="product-list" class="product-grid"></div>
  </main>
  <footer class="footer">© 2026 ShopEasy - Final Project C4E</footer>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
