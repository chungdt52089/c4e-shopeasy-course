<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trang chủ - ShopEasy</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <a href="index.html" class="logo">Shop<span>Easy</span></a>
    <nav class="nav">
      <a href="index.html">Trang chủ</a>
      <a href="products.html">Sản phẩm</a>
      <a href="orders.html">Đơn hàng</a>
      <a href="cart.html">Giỏ hàng <span id="cart-count" class="badge">0</span></a>
    </nav>
    <div id="user-box" class="user-box">
      <a href="login.html" class="btn">Đăng nhập</a>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1>Mua sắm dễ dàng mỗi ngày</h1>
      <form action="products.html" class="search-form">
        <input type="text" name="q" placeholder="Bạn muốn tìm gì?">
        <button class="btn">Tìm kiếm</button>
      </form>
    </section>

    <section class="container">
      <h2 class="section-title">Sản phẩm nổi bật</h2>
      <div id="featured-list" class="product-grid"></div>
    </section>
  </main>
  <footer class="footer">© 2026 ShopEasy - Final Project C4E</footer>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
